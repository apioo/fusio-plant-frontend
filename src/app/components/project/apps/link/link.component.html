@for (property of local(); track $index) {
  <div class="mb-3 row">
    <div class="col-sm-12">
      <div class="input-group">
        <select
          [id]="name() + '-' + $index"
          [name]="name() + '-' + $index"
          [ngModel]="property.value"
          (ngModelChange)="doChange($index, $event)"
          [disabled]="disabled()"
          class="form-select">
          @for (container of containers(); track container) {
            <option [ngValue]="container">{{ container }}</option>
          }
        </select>
        <button class="btn btn-danger" type="button" (click)="doRemove($index)" [disabled]="disabled()">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>
  </div>
}

<div class="mb-3 row">
  <div class="col-sm-12">
    <div class="input-group">
      <select
        [id]="name() + '-newValue'"
        [name]="name() + '-newValue'"
        [(ngModel)]="newValue"
        (keydown.enter)="doAdd()"
        [disabled]="disabled()"
        class="form-select">
        @for (container of containers(); track container) {
          <option [ngValue]="container">{{ container }}</option>
        }
      </select>
      <button class="btn btn-success" type="button" (click)="doAdd()" [disabled]="disabled()">
        <i class="bi bi-plus"></i>
      </button>
    </div>
  </div>
</div>
