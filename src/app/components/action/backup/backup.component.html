
<h1>Backup</h1>

<ngb-alert type="info">Through this panel you can export/import the complete server configuration.</ngb-alert>

<fusio-message [response]="result()"></fusio-message>

<div class="row">
  <div class="col-6">
    @if (!exportLoading()) {
      <button (click)="doExport()" class="btn btn-primary">Export</button>
    }
    @else {
      <button class="btn btn-primary" disabled><span class="spinner-border spinner-border-sm" aria-hidden="true"></span><span role="status" class="ms-1">Exporting ...</span></button>
    }
    <div style="height:600px;" class="mt-3">
      <ngx-monaco-editor style="height:100%" name="export" [options]="{theme: 'vs-light', language: 'json', readOnly: true}" [ngModel]="export()"></ngx-monaco-editor>
    </div>
  </div>
  <div class="col-6">
    @if (!importLoading()) {
      <button (click)="doImport()" class="btn btn-primary">Import</button>
    }
    @else {
      <button class="btn btn-primary" disabled><span class="spinner-border spinner-border-sm" aria-hidden="true"></span><span role="status" class="ms-1">Importing ...</span></button>
    }
    <div style="height:600px;" class="mt-3">
      <ngx-monaco-editor style="height:100%" name="import" [options]="{theme: 'vs-light', language: 'json'}" [ngModel]="import()" (ngModelChange)="import.set($event)"></ngx-monaco-editor>
    </div>
  </div>
</div>
